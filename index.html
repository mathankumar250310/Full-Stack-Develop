<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        button{
            margin-top: 20px;
            background-color: bisque;
            color: brown;
            font-size: large;
        }
        button{
            background-color: rgb(218, 237, 93);;
        }
        body {
            font-family: sans-serif;
            background-color: blanchedalmond;
            align-items: center;
            justify-content: center;
            
        }
        h1{
            text-align: center;
            color: rgb(26, 26, 4);
        }
        form{
            background: deepskyblue;
            width: 90%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <table>
        <tbody>
            <h1>Student Registration Form</h1>
            <hr>
            <tr>
                <td>Name</td>
                <td>
                    <input type ="name">
                </td>
            </tr>
            <tr>
                <td> Father Name</td>
                <td>
                    <input type ="name">
                </td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type ="date">
                </td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type ="radio" name="gender" value="male">Male
                    <input type ="radio" name="gender" value="female">Female
                </td>
            </tr>
             <tr>
                <td>Email</td>
                <td>
                    <input type ="email">
                </td>
            </tr>
             <tr>
                <td>Age</td>
                <td>
                    <input type ="number">
                </td>
            </tr>
             <tr>
                <td>Phone Number</td>
                <td>
                    <input type ="number">
                </td>
            </tr>
            <tr>
                <td>State</td>
                <td>
                    <select name ="state">
                        <option>Select State</option>
                        <option>Tamilnadu</option>
                        <option>Kerala</option>
                        <option>Karnataka</option>
                        <option>Telungana</option>
                </td>
            </tr>
            <tr>
                <td>District</td>
                <td>
                    <select name ="district">
                        <option>Select District</option>
                        <option>Tuticorin</option>
                        <option>Madurai</option>
                        <option>Chennai</option>
                        <option>Virudhunagar</option>
                        <option>Salem</option>
                        <option>Karur</option>
                        <option>Nammakal</option>
                        <option>Trichy</option>
                        <option>Tenkasi</option>
                </td>
            </tr>
            <tr>
                <td>Address</td>
                <td>
                    <input type ="text">
                </td>
            </tr>
            <tr>
                <td>Pincode</td>
                <td>
                    <input type ="number">
                </td>
            </tr>
             <tr>
                <td>College Name</td>
                <td>
                    <input type ="name">
                </td>
            </tr>
             <tr>
                <td>10th Mark</td>
                <td>
                    <input type ="number">
                </td>
            </tr>
             <tr>
                <td>12th Mark</td>
                <td>
                    <input type ="number">
                </td>
            </tr>
             <tr>
                <td>UG Percentage</td>
                <td>
                    <input type ="number">
                </td>
            </tr>
            <tr>
                <td>Resume</td>
                <td>
                    <input type ="file">
                </td>
            </tr>
            
             <tr>
                <td>Student Id</td>
                <td>
                   
                    <input type ="text">
                </td>
            </tr>
             <tr>
                <td>Password</td>
                <td>
                    <input type ="password">
                </td>
            </tr>
        </tbody>
    </table>
    <button type="sumbit">Submit</button>
</body>
</html>
